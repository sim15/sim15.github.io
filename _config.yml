title: simon beyzerov.
author: simon beyzerov
description: >- # this means to ignore newlines until "baseurl:"
baseurl: / # the subpath of your site, e.g. /blog
url: "https://sim15.github.io" # the base hostname & protocol for your site, e.g. http://example.com
lang: en
timezone: UTC

comments: false

# Build settings
theme: jekyll-whiteglass
plugins:
  - jekyll-archives
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - README.md

# Outputting
permalink: /:year/:month/:day/:title/

# Markdown settings
markdown: kramdown
excerpt_separator: "<!-- more -->"
kramdown:
  auto_ids: false
  enable_coderay: false
  entity_output: as_char
  footnote_nr: 1
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  toc_levels: 1..6
  # math_engine: katex

# jekyll-archives
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: category_archives
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/

# jekyll-paginate
paginate_path: /posts/:num/
paginate: 5
